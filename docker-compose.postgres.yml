services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: local-development-secret
      DATABASE_URL: postgresql+psycopg://taskuser:taskpass@db:5432/taskplanner
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskplanner
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
